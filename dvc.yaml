params:
  - params.yaml

stages:
  ingestion:
    desc: "Unduh data historis harga saham bank dari Yahoo Finance"
    cmd: python -m src.ingestion
    deps:
      - src/config.py
      - src/ingestion.py
    params:
      - tickers
      - start_date
      - end_date
    outs:
      - artifact/data:
          persist: true
  ml_pipeline:
    desc: "Evaluasi hyperparameter ARIMA/SARIMA dan peramalan masa depan per ticker"
    matrix:
      ticker: ${tickers}
    cmd: >-
      papermill
      src/ml_pipeline.ipynb
      artifact/notebook/ml_pipeline_${item.ticker}.ipynb
      -p data_path artifact/data/${item.ticker}.csv
      -p train_size_ratio ${train_size_ratio}
      -p target_col ${target_col}
      -p forecast_steps ${forecast_steps}
      --log-output
      --progress-bar
    deps:
      - src/ml_pipeline.ipynb
      - artifact/data/${item.ticker}.csv
    params:
      - train_size_ratio
      - target_col
      - forecast_steps
    outs:
      - artifact/notebook/ml_pipeline_${item.ticker}.ipynb:
          cache: false
      - artifact/forecast/${item.ticker}_forecast.csv:
          persist: true
  store:
    desc: "Generate seed SQL Cloudflare D1 untuk data historis dan peramalan"
    cmd: python -m src.store
    deps:
      - src/config.py
      - src/store.py
      - artifact/data
      - artifact/forecast
    params:
      - tickers
    outs:
      - artifact/seed.sql:
          persist: true

