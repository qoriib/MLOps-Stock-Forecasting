stages:
  ingestion:
    cmd: python -m src.ingestion
    deps:
      - src/config.py
      - src/ingestion.py
    params:
      - tickers
      - start_date
      - end_date
    outs:
      - artifact/data:
          persist: true
  ml_pipeline:
    cmd: >-
      papermill
      src/ml_pipeline.ipynb
      artifact/notebook/ml_pipeline_output.ipynb
      -p data_path artifact/data/${tickers[0]}.csv
      -p train_size_ratio ${train_size_ratio}
      -p target_col ${target_col}
    deps:
      - src/ml_pipeline.ipynb
      - artifact/data/${tickers[0]}.csv
    params:
      - tickers
      - train_size_ratio
      - target_col
    outs:
      - artifact/notebook/ml_pipeline_output.ipynb:
          cache: false
