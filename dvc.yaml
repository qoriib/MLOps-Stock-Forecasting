params:
  - params.yaml

stages:
  data_ingestion:
    matrix:
      TICKER: ${TICKERS}
    cmd: >-
      python -m src.data_ingestion
      --ticker ${item.TICKER}
      --range-days ${RANGE_DAYS}
      --end-date ${END_DATE}
    deps:
      - src/config.py
      - src/data_ingestion.py
    params:
      - RANGE_DAYS
      - END_DATE
    outs:
      - artifact/data/${item.TICKER}.csv

  data_understanding:
    matrix:
      TICKER: ${TICKERS}
    cmd: >-
      python -m src.data_understanding
      --ticker ${item.TICKER}
      --target-col ${TARGET_COL}
    deps:
      - src/config.py
      - src/data_understanding.py
      - artifact/data/${item.TICKER}.csv
    params:
      - TARGET_COL
    metrics:
      - artifact/metrics/${item.TICKER}_understanding.json

  data_preparation:
    matrix:
      TICKER: ${TICKERS}
    cmd: >-
      python -m src.data_preparation
      --ticker ${item.TICKER}
      --train-size ${TRAIN_SIZE}
      --target-col ${TARGET_COL}
    deps:
      - src/config.py
      - src/data_preparation.py
      - artifact/data/${item.TICKER}.csv
    params:
      - TRAIN_SIZE
      - TARGET_COL
    outs:
      - artifact/model/${item.TICKER}_scaler.pkl
      - artifact/data/${item.TICKER}_prepared.npz

  modeling:
    matrix:
      TICKER: ${TICKERS}
    cmd: >-
      python -m src.modeling
      --ticker ${item.TICKER}
      --epochs ${EPOCHS}
      --random-state ${RANDOM_STATE}
      --target-col ${TARGET_COL}
      --n-jobs ${N_JOBS}
    deps:
      - src/config.py
      - src/modeling.py
      - artifact/data/${item.TICKER}_prepared.npz
      - artifact/model/${item.TICKER}_scaler.pkl
    params:
      - TARGET_COL
      - RANDOM_STATE
      - EPOCHS
      - N_JOBS
      - TIME_STEPS
      - BATCH_SIZES
      - LEARNING_RATES
    outs:
      - artifact/model/${item.TICKER}_LSTM.keras
      - artifact/model/${item.TICKER}_GRU.keras
    metrics:
      - artifact/metrics/${item.TICKER}_hyperparameter.csv

  evaluation:
    matrix:
      TICKER: ${TICKERS}
    cmd: >-
      python -m src.evaluation
      --ticker ${item.TICKER}
      --target-col ${TARGET_COL}
      --threshold-mape ${THRESHOLD_MAPE}
    deps:
      - src/config.py
      - src/evaluation.py
      - artifact/data/${item.TICKER}_prepared.npz
      - artifact/model/${item.TICKER}_scaler.pkl
      - artifact/model/${item.TICKER}_LSTM.keras
      - artifact/model/${item.TICKER}_GRU.keras
      - artifact/metrics/${item.TICKER}_hyperparameter.csv
    params:
      - TARGET_COL
      - THRESHOLD_MAPE
    plots:
      - artifact/plots/${item.TICKER}_LSTM_inference.png
      - artifact/plots/${item.TICKER}_GRU_inference.png
    metrics:
      - artifact/metrics/${item.TICKER}_evaluation.json
    outs:
      - web/backend/assets/${item.TICKER}_LSTM.keras:
          persist: true
      - web/backend/assets/${item.TICKER}_GRU.keras:
          persist: true
      - web/backend/assets/${item.TICKER}_scaler.pkl:
          persist: true
