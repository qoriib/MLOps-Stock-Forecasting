params:
  - params.yaml

stages:
  ingestion:
    desc: "Unduh data historis harga saham bank dari Yahoo Finance"
    cmd: python -m src.ingestion
    deps:
      - src/config.py
      - src/ingestion.py
    params:
      - tickers
      - start_date
      - end_date
    outs:
      - artifact/data
  ml_pipeline:
    desc: "Evaluasi hyperparameter ARIMA/SARIMA dan penyimpanan model per ticker"
    matrix:
      ticker: ${tickers}
    cmd: >-
      papermill
      src/ml_pipeline.ipynb
      artifact/notebook/ml_pipeline_${item.ticker}.ipynb
      -p data_path artifact/data/${item.ticker}.csv
      -p train_size_ratio ${train_size_ratio}
      -p target_col ${target_col}
      --log-output
      --progress-bar
    deps:
      - src/ml_pipeline.ipynb
      - artifact/data/${item.ticker}.csv
    params:
      - train_size_ratio
      - target_col
    outs:
      - artifact/notebook/ml_pipeline_${item.ticker}.ipynb:
          cache: false
      - artifact/model/${item.ticker}.pkl
