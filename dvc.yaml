params:
  - params.yaml

stages:
  ingestion:
    desc: "Unduh data historis harga saham bank dari Yahoo Finance"
    cmd: python -m src.ingestion
    deps:
      - src/config.py
      - src/ingestion.py
    params:
      - tickers
      - start_date
      - end_date
    outs:
      - artifact/data
  ml_pipeline:
    desc: "Pelatihan model LSTM & GRU serta penyimpanan model, scaler, dan metrik per ticker"
    matrix:
      ticker: ${tickers}
    cmd: >-
      papermill
      src/ml_pipeline.ipynb
      artifact/notebook/ml_pipeline_${item.ticker}.ipynb
      -p TICKER ${item.ticker}
      -p TARGET_COL ${target_col}
      -p TRAIN_SIZE_RATIO ${train_size_ratio}
      -p RANDOM_STATE ${random_state}
      -p WINDOW_SIZE ${window_size}
      -p BATCH_SIZE ${batch_size}
      -p EPOCHS ${epochs}
      -p LEARNING_RATE ${learning_rate}
      --report-mode
      --log-output
      --progress-bar
    deps:
      - src/ml_pipeline.ipynb
      - artifact/data/${item.ticker}.csv
    params:
      - target_col
      - train_size_ratio
      - random_state
      - window_size
      - batch_size
      - epochs
      - learning_rate
    outs:
      - artifact/notebook/ml_pipeline_${item.ticker}.ipynb:
          cache: false
      - artifact/model/${item.ticker}_LSTM.keras
      - artifact/model/${item.ticker}_GRU.keras
      - artifact/model/${item.ticker}_scaler.pkl
      - artifact/model/${item.ticker}_metrics.json


