params:
  - params.yaml

stages:
  ingestion:
    desc: "Unduh data historis harga saham bank dari Yahoo Finance"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.ingestion --ticker ${item.TICKER} --range-days ${RANGE_DAYS} --end-date ${END_DATE}
    deps:
      - src/config.py
      - src/ingestion.py
    params:
      - RANGE_DAYS
      - END_DATE
    outs:
      - artifact/data/${item.TICKER}.csv

  ml_pipeline:
    desc: "Pelatihan model LSTM & GRU serta pencarian hyperparameter optimal per ticker"
    matrix:
      TICKER: ${TICKERS}
    cmd: >-
      papermill
      src/ml_pipeline.ipynb
      artifact/notebook/ml_pipeline_${item.TICKER}.ipynb
      -f params.yaml
      -p TICKER ${item.TICKER}
      --report-mode
      --log-output
      --progress-bar
    deps:
      - src/config.py
      - src/ml_pipeline.ipynb
      - artifact/data/${item.TICKER}.csv
    params:
      - TARGET_COL
      - TRAIN_SIZE
      - RANDOM_STATE
      - EPOCHS
      - TIME_STEPS
      - OPTIMIZERS
      - BATCH_SIZES
      - LEARNING_RATES
    outs:
      - artifact/notebook/ml_pipeline_${item.TICKER}.ipynb:
          cache: false
      - artifact/model/${item.TICKER}_LSTM.keras
      - artifact/model/${item.TICKER}_GRU.keras
      - artifact/model/${item.TICKER}_scaler.pkl
      - artifact/model/${item.TICKER}_hyperparameter.csv

  store:
    desc: "Penyalinan model champion dan artefak scaler dari MLflow ke backend assets"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.store --ticker ${item.TICKER}
    deps:
      - src/config.py
      - src/store.py
      - artifact/model/${item.TICKER}_LSTM.keras
      - artifact/model/${item.TICKER}_GRU.keras
      - artifact/model/${item.TICKER}_scaler.pkl
    outs:
      - web/backend/assets/${item.TICKER}_scaler.pkl
      - web/backend/assets/${item.TICKER}_LSTM.keras
      - web/backend/assets/${item.TICKER}_GRU.keras

  report:
    desc: "Pembuatan ringkasan laporan dataset dan performa hyperparameter model"
    cmd: python -m src.report --output artifact/report.md
    deps:
      - src/config.py
      - src/report.py
      - artifact/model
    outs:
      - artifact/report.md:
          cache: false
