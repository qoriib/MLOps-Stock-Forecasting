params:
  - params.yaml

stages:
  data_ingestion:
    desc: "CRISP-DM Stage 1: Ingest stock data from Yahoo Finance"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.data_ingestion --ticker ${item.TICKER} --range-days ${RANGE_DAYS} --end-date ${END_DATE}
    deps:
      - src/config.py
      - src/data_ingestion.py
    params:
      - RANGE_DAYS
      - END_DATE
    outs:
      - artifact/data/${item.TICKER}.csv

  data_understanding:
    desc: "CRISP-DM Stage 2: Data quality check, gap analysis & historical statistics"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.data_understanding --ticker ${item.TICKER} --target-col ${TARGET_COL}
    deps:
      - src/config.py
      - src/data_understanding.py
      - artifact/data/${item.TICKER}.csv
    params:
      - TARGET_COL
    plots:
      - artifact/plots/${item.TICKER}_historical_price.png
    metrics:
      - artifact/metrics/${item.TICKER}_data_understanding.json

  data_preparation:
    desc: "CRISP-DM Stage 3: Chronological train/test split & MinMaxScaler scaling"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.data_preparation --ticker ${item.TICKER} --train-size ${TRAIN_SIZE} --target-col ${TARGET_COL}
    deps:
      - src/config.py
      - src/data_preparation.py
      - artifact/data/${item.TICKER}.csv
    params:
      - TRAIN_SIZE
      - TARGET_COL
    outs:
      - artifact/model/${item.TICKER}_scaler.pkl
      - artifact/data/${item.TICKER}_prepared.npz

  modeling:
    desc: "CRISP-DM Stage 4: LSTM & GRU grid search training with early stopping"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.modeling --ticker ${item.TICKER} --epochs ${EPOCHS} --random-state ${RANDOM_STATE} --target-col ${TARGET_COL} --params-file params.yaml
    deps:
      - src/config.py
      - src/modeling.py
      - artifact/data/${item.TICKER}_prepared.npz
      - artifact/model/${item.TICKER}_scaler.pkl
    params:
      - TARGET_COL
      - RANDOM_STATE
      - EPOCHS
      - TIME_STEPS
      - OPTIMIZERS
      - BATCH_SIZES
      - LEARNING_RATES
    outs:
      - artifact/model/${item.TICKER}_LSTM.keras
      - artifact/model/${item.TICKER}_GRU.keras
    metrics:
      - artifact/metrics/${item.TICKER}_hyperparameter.csv

  evaluation:
    desc: "CRISP-DM Stage 5: Evaluation on test set, inference visualization & MLflow registration"
    matrix:
      TICKER: ${TICKERS}
    cmd: python -m src.evaluation --ticker ${item.TICKER} --target-col ${TARGET_COL}
    deps:
      - src/config.py
      - src/evaluation.py
      - artifact/data/${item.TICKER}_prepared.npz
      - artifact/model/${item.TICKER}_scaler.pkl
      - artifact/model/${item.TICKER}_LSTM.keras
      - artifact/model/${item.TICKER}_GRU.keras
      - artifact/metrics/${item.TICKER}_hyperparameter.csv
    params:
      - TARGET_COL
    plots:
      - artifact/plots/${item.TICKER}_LSTM_inference.png
      - artifact/plots/${item.TICKER}_GRU_inference.png
    metrics:
      - artifact/metrics/${item.TICKER}_evaluation.json

  report:
    desc: "CRISP-DM Stage 6: Generate pipeline summary report"
    cmd: python -m src.report --output artifact/report.md
    deps:
      - src/config.py
      - src/report.py
      - artifact/metrics
    outs:
      - artifact/report.md:
          cache: false
