version: v0.1
testId: stock-forecast-backend-load-test
displayName: Stock Forecast Backend Load Test (Locust)
description: Automated Locust load testing for Stock Forecast Backend API on Azure (Upgraded CPU)
testType: Locust
testPlan: locustfile.py

engineInstances: 1

env:
  - name: LOCUST_HOST
    value: https://ca-stock-backend.eastasia.azurecontainerapps.io

failureCriteria:
  - avg(response_time_ms) > 1000
  - p90(response_time_ms) > 1500
  - p95(response_time_ms) > 2500
  - percentage(error) > 0.5

autoStop:
  errorPercentage: 10
  timeWindow: 15