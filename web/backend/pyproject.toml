[project]
name = "stock-forecast-api"
version = "0.1.0"
description = "FastAPI Inference Backend for MLOps Stock Forecasting"
authors = [
    { name = "MLOps Engineer", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pmdarima>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.poetry]
packages = [
    { include = "app" },
    { include = "main.py" }
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
