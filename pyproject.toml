[project]
name = "mlops-stock-forecasting"
version = "0.1.0"
description = "MLOps Pipeline for Stock Forecasting"
authors = [
    { name = "MLOps Engineer", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "dvc>=3.0.0",
    "pyyaml>=6.0.0",
    "yfinance>=0.2.0",
    "papermill>=2.4.0",
    "tensorflow (==2.19.1)",
    "nbconvert>=7.0.0",
    "ipykernel (>=7.3.0,<8.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "mlflow (==3.5.1)",
    "tqdm (>=4.70.1,<5.0.0)",
    "dagshub (>=0.7.2,<0.8.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)",
    "dvc-s3 (>=3.0.0)",
    "psycopg2-binary (>=2.9.0)",
]

[project.scripts]
ingestion = "src.ingestion:main"

[tool.poetry]
packages = [{ include = "src" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
