[project]
name = "mlops-stock-forecasting"
version = "0.1.0"
description = "MLOps Pipeline for Stock Forecasting"
authors = [
    { name = "MLOps Engineer", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.30.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "dvc>=3.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
ingestion = "src.ingestion:main"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
