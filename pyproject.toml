[project]
name = "mlops-stock-forecasting"
version = "0.1.0"
description = "MLOps Pipeline for Stock Forecasting"
authors = [
    { name = "MLOps Engineer", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "dvc>=3.0.0",
    "pyyaml>=6.0.0",
    "yfinance>=0.2.0",
    "papermill>=2.4.0",
    "pmdarima (>=2.1.1,<3.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]

[project.scripts]
ingestion = "ingestion:main"

[tool.poetry]
packages = [{ include = "*", from = "src" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
