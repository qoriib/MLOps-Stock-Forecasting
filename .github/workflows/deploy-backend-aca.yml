name: Test & Deploy Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/backend/**"
      - ".github/workflows/deploy-backend-aca.yml"

permissions:
  contents: read

jobs:
  test_and_deploy_backend:
    name: "Test & Deploy Backend (Standalone)"
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: mlops-stock-forecasting-rg
      AZURE_ACR_NAME: acrstockforecast
      CONTAINER_APP_NAME: ca-stock-backend
      CONTAINER_APP_ENVIRONMENT: ca-stock-backend-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        id: acr-creds
        run: |
          echo "username=$(az acr credential show -n ${{ env.AZURE_ACR_NAME }} --query username -o tsv)" >> $GITHUB_OUTPUT
          echo "password=$(az acr credential show -n ${{ env.AZURE_ACR_NAME }} --query 'passwords[0].value' -o tsv)" >> $GITHUB_OUTPUT

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          targetPort: 8000
          ingress: external
          location: eastasia
          appSourcePath: ${{ github.workspace }}/web/backend
          acrName: ${{ env.AZURE_ACR_NAME }}
          acrUsername: ${{ steps.acr-creds.outputs.username }}
          acrPassword: ${{ steps.acr-creds.outputs.password }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
