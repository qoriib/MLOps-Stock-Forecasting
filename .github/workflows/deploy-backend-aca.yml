name: Test & Deploy Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/backend/**"
      - ".github/workflows/deploy-backend-aca.yml"

permissions:
  contents: read

jobs:
  test_and_deploy_backend:
    name: "Test & Deploy Backend (Standalone)"
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: mlops-stock-forecasting-rg
      AZURE_ACR_NAME: acrstockforecast
      CONTAINER_APP_NAME: ca-stock-backend
      CONTAINER_APP_ENVIRONMENT: ca-stock-backend-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Safeguard ACR Admin & Cleanup Stuck Container App
        id: acr-creds
        run: |
          az acr update -n ${{ env.AZURE_ACR_NAME }} --admin-enabled true
          ACR_USER=$(az acr credential show --name ${{ env.AZURE_ACR_NAME }} --query username --output tsv)
          ACR_PASS=$(az acr credential show --name ${{ env.AZURE_ACR_NAME }} --query "passwords[0].value" --output tsv)
          echo "username=$ACR_USER" >> $GITHUB_OUTPUT
          echo "::add-mask::$ACR_PASS"
          echo "password=$ACR_PASS" >> $GITHUB_OUTPUT

          APP_STATE=$(az containerapp show -n ${{ env.CONTAINER_APP_NAME }} -g ${{ env.AZURE_RESOURCE_GROUP }} --query properties.provisioningState -o tsv 2>/dev/null || echo "NotFound")
          if [ "$APP_STATE" = "Failed" ]; then
            echo "Container app is stuck in Failed state. Deleting to allow clean recreation..."
            az containerapp delete -n ${{ env.CONTAINER_APP_NAME }} -g ${{ env.AZURE_RESOURCE_GROUP }} --yes
          fi

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          location: eastasia
          appSourcePath: ${{ github.workspace }}/web/backend
          acrName: ${{ env.AZURE_ACR_NAME }}
          acrUsername: ${{ steps.acr-creds.outputs.username }}
          acrPassword: ${{ steps.acr-creds.outputs.password }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Verify Backend Health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "Backend URL: https://$FQDN"
          curl -sS -f "https://$FQDN/" || exit 1
