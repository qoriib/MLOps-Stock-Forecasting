name: Deploy Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/backend/**"
      - ".github/workflows/deploy-backend-aca.yml"

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: mlops-stock-forecasting-rg
  ACR_NAME: acrstockforecast
  CONTAINER_APP_NAME: ca-stock-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/web/backend
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          location: eastasia
