name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  pipeline:
    name: "ML Pipeline"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC ML Pipeline
        run: poetry run dvc repro

      - name: Push Data & Git State
        uses: ./.github/actions/push-pipeline

      - name: Upload Notebook Reports
        uses: actions/upload-artifact@v4
        with:
          name: artifact-notebook
          path: artifact/notebook/**

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-model
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.pkl
            artifact/model/*_hyperparameter.csv

  deploy_backend:
    name: "Deploy Backend"
    needs: pipeline
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: mlops-stock-forecasting-rg
      AZURE_ACR_NAME: acrstockforecast
      CONTAINER_APP_NAME: ca-stock-backend
      CONTAINER_APP_ENVIRONMENT: ca-stock-backend-env
    outputs:
      backend_url: ${{ steps.get-backend-url.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          location: eastasia
          appSourcePath: ${{ github.workspace }}/web/backend
          acrName: ${{ env.AZURE_ACR_NAME }}
          acrUsername: ${{ secrets.AZURE_ACR_USERNAME }}
          acrPassword: ${{ secrets.AZURE_ACR_PASSWORD }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Get Container App URL
        id: get-backend-url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=https://$FQDN" >> $GITHUB_OUTPUT

  deploy_frontend:
    name: "Deploy Frontend"
    needs: [pipeline, deploy_backend]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ needs.deploy_backend.outputs.backend_url || secrets.VITE_API_URL }}
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          cd web/frontend
          npx -y @azure/static-web-apps-cli deploy .output/public \
            --env production \
            --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" \
            --no-use-keychain
