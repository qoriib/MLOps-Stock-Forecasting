name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
  CLOUDFLARE_SECRET_KEY: ${{ secrets.CLOUDFLARE_SECRET_KEY }}
  MLFLOW_TRACKING_URI: https://dagshub.com/qoriib/MLOps-Stock-Forecasting.mlflow
  MLFLOW_TRACKING_USERNAME: qoriib
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_USER_TOKEN }}


jobs:
  ingestion:
    name: "Data Ingestion"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Ingestion
        run: poetry run python -m src.ingestion

      - name: Push Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update stock ingestion data [skip ci]"

  pipeline:
    name: "ML Pipeline"
    needs: ingestion
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC ML Pipeline
        run: poetry run dvc repro

      - name: Push Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update ml pipeline & store artifacts [skip ci]"

      - name: Upload Notebook Reports
        uses: actions/upload-artifact@v4
        with:
          name: notebook-reports
          path: artifact/notebook/**

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.json
            artifact/model/*_metrics.json
            artifact/model/*_hyperparameter.csv

  deploy_backend:
    name: "Deploy Backend"
    needs: pipeline
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pipeline Environment (DVC Pull)
        uses: ./.github/actions/setup-pipeline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd web/backend
          npm ci

      - name: Build Backend with Nitro
        run: |
          cd web/backend
          npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/backend
          command: deploy

  deploy_frontend:
    name: "Deploy Frontend"
    needs: pipeline
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/frontend
          command: pages deploy dist --project-name stock-forecasting-web

