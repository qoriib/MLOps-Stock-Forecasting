name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  schedule:
    # Retraining & deployment otomatis setiap hari Senin pukul 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * 1"

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

# ─────────────────────────────────────────────────────────
# JOB 1 · Ingestion
# Unduh data historis OHLCV dari Yahoo Finance → artifact/data/*.csv
# ─────────────────────────────────────────────────────────
jobs:
  ingestion:
    name: "① Ingestion — Yahoo Finance → Raw CSV Data"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Ingestion
        run: poetry run python -m src.ingestion

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update stock ingestion data [skip ci]"

      - name: Upload Ingestion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-artifacts
          path: |
            artifact/data/*.parquet

# ─────────────────────────────────────────────────────────
# JOB 2 · ML Pipeline & Store
# Jalankan DVC ml_pipeline & store (LSTM/GRU tuning, scalers, metrik, SQL seeds)
# ─────────────────────────────────────────────────────────
  pipeline:
    name: "② ML Pipeline & Store — Training, Tuning & Seeding"
    needs: ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Download Ingestion Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ingestion-artifacts
          path: artifact/data/

      - name: Run DVC ML Pipeline & Store Stages
        run: poetry run dvc repro

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Publish Notebook Reports to GitHub Summary
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          notebooks=(artifact/notebook/*.ipynb)

          mkdir -p artifact/notebook

          for nb in "${notebooks[@]}"; do
            if [ -f "$nb" ]; then
              stage=$(basename "$nb" .ipynb)
              echo "Processing $nb ($stage)..."
              poetry run jupyter nbconvert --to markdown --no-input "$nb" --output-dir artifact/notebook || true

              if [ -d "artifact/notebook/${stage}_files" ]; then
                for img in artifact/notebook/${stage}_files/*.png; do
                  if [ -f "$img" ]; then
                    img_url=$(cml publish "$img" || echo "")
                    filename=$(basename "$img")
                    if [ -n "$img_url" ]; then
                      sed -i "s|${stage}_files/${filename}|${img_url}|g" "artifact/notebook/${stage}.md" || true
                    fi
                  fi
                done
              fi

              if [ -f "artifact/notebook/${stage}.md" ]; then
                cat "artifact/notebook/${stage}.md" >> $GITHUB_STEP_SUMMARY
                echo -e "\n\n---\n\n" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: Push ML Artifacts & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update ml pipeline & store artifacts [skip ci]"

      - name: Upload Notebook Reports
        uses: actions/upload-artifact@v4
        with:
          name: notebook-reports
          path: artifact/notebook/**

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.json
            artifact/model/*_metrics.json
            artifact/model/*_hyperparameter.parquet

      - name: Upload Backend Assets
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: web/backend/assets/**

# ─────────────────────────────────────────────────────────
# JOB 3 · Deploy Backend
# Build & deploy Cloudflare Workers API dengan aset Parquet & model tersemat langsung
# ─────────────────────────────────────────────────────────
  deploy_backend:
    name: "③ Deploy Backend — Cloudflare Workers"
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Backend Assets (Parquet & JSON)
        uses: actions/download-artifact@v4
        with:
          name: backend-assets
          path: web/backend/assets/


      - name: Install Backend Dependencies
        run: |
          cd web/backend
          npm ci

      - name: Build Backend with Nitro
        run: |
          cd web/backend
          npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/backend
          command: deploy

# ─────────────────────────────────────────────────────────
# JOB 4 · Deploy Frontend
# Build & deploy Cloudflare Pages (berjalan paralel dengan deploy_backend)
# ─────────────────────────────────────────────────────────
  deploy_frontend:
    name: "④ Deploy Frontend — Cloudflare Pages"
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/frontend
          command: pages deploy dist --project-name stock-forecasting-web

