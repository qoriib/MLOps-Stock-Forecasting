name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_ml:
        description: "Skip ML Pipeline"
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "0 1 1 * *"

permissions:
  contents: write

env:
  AZURE_VM_NAME: vm-mlops-runner
  AZURE_RESOURCE_GROUP: mlops-stock-forecasting-rg
  AZURE_STORAGE_ACCOUNT: storagestockforecast
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  start_vm:
    name: "Allocate Azure VM"
    if: ${{ github.event_name == 'schedule' || !inputs.skip_ml }}
    runs-on: ubuntu-24.04
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start Azure VM Runner
        run: |
          az vm start --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_VM_NAME }}
          sleep 30

  pipeline:
    name: "ML Pipeline"
    needs: start_vm
    if: ${{ github.event_name == 'schedule' || !inputs.skip_ml }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC ML Pipeline
        run: poetry run dvc repro

      - name: Push Data & Git State
        uses: ./.github/actions/push-pipeline

      - name: Generate Pipeline Report
        run: |
          poetry run papermill notebooks/ml_report.ipynb artifact/report.ipynb -k python3
          poetry run jupyter nbconvert artifact/report.ipynb --to markdown --no-input --output-dir artifact --output report.md

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish Pipeline Report to Summary
        uses: ./.github/actions/publish-report
        with:
          report-file: artifact/report.md
          plots-dir: artifact/plots
          storage-account: ${{ env.AZURE_STORAGE_ACCOUNT }}
          container-name: plots

      - name: Publish Report to GitHub Summary
        run: cat artifact/report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Metrics Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-metrics
          path: |
            artifact/plots/**
            artifact/metrics/**
            artifact/report.md

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-model
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.pkl
            artifact/metrics/*_hyperparameter.csv

  stop_vm:
    name: "Deallocate Azure VM"
    needs: [start_vm, pipeline]
    if: ${{ always() && !cancelled() && needs.start_vm.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deallocate Azure VM
        run: |
          az vm deallocate \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_VM_NAME }} \
            --no-wait

  deploy_backend:
    name: "Deploy Backend"
    needs: pipeline
    if: ${{ always() && !cancelled() && (needs.pipeline.result == 'success' || needs.pipeline.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      AZURE_ACR_NAME: acrstockforecast
      AZURE_LOAD_TEST_RESOURCE: alt-stock-forecast
      CONTAINER_APP_NAME: ca-stock-backend
      CONTAINER_APP_ENVIRONMENT: ca-stock-backend-env
    outputs:
      backend_url: ${{ steps.get-backend-url.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Pull Model Assets
        run: poetry run dvc pull

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        id: acr-creds
        run: |
          echo "username=$(az acr credential show -n ${{ env.AZURE_ACR_NAME }} --query username -o tsv)" >> $GITHUB_OUTPUT
          echo "password=$(az acr credential show -n ${{ env.AZURE_ACR_NAME }} --query 'passwords[0].value' -o tsv)" >> $GITHUB_OUTPUT

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          targetPort: 8000
          ingress: external
          location: eastasia
          appSourcePath: ${{ github.workspace }}/web/backend
          acrName: ${{ env.AZURE_ACR_NAME }}
          acrUsername: ${{ steps.acr-creds.outputs.username }}
          acrPassword: ${{ steps.acr-creds.outputs.password }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Get Container App URL
        id: get-backend-url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=https://$FQDN" >> $GITHUB_OUTPUT

      - name: Publish Backend Deployment Summary
        run: |
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Container App | \`${{ env.CONTAINER_APP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | \`${{ env.AZURE_RESOURCE_GROUP }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend URL | [${{ steps.get-backend-url.outputs.backend_url }}](${{ steps.get-backend-url.outputs.backend_url }}) |" >> $GITHUB_STEP_SUMMARY

      - name: Run Azure Load Testing
        uses: azure/load-testing@v1
        continue-on-error: true
        with:
          loadTestConfigFile: web/backend/tests/alt-config.yaml
          loadTestResource: ${{ env.AZURE_LOAD_TEST_RESOURCE }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          env: |
            [
              {
                "name": "LOCUST_HOST",
                "value": "${{ steps.get-backend-url.outputs.backend_url }}"
              }
            ]

  deploy_frontend:
    name: "Deploy Frontend"
    needs: deploy_backend
    if: ${{ always() && !cancelled() && needs.deploy_backend.outputs.backend_url != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ needs.deploy_backend.outputs.backend_url }}
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          cd web/frontend
          npx -y @azure/static-web-apps-cli deploy dist \
            --env production \
            --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" \
            --no-use-keychain
