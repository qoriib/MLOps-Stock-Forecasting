name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  schedule:
    # Retraining & deployment otomatis setiap hari Senin pukul 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * 1"

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

# ─────────────────────────────────────────────────────────
# JOB 1 · Ingestion
# Unduh data historis OHLCV dari Yahoo Finance → artifact/data/
# Hasilkan: <TICKER>.csv + <TICKER>_seed.sql
# ─────────────────────────────────────────────────────────
jobs:
  ingestion:
    name: "① Ingestion — Yahoo Finance → CSV + SQL Seed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Ingestion
        run: poetry run python -m src.ingestion

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update stock ingestion artifacts [skip ci]"

      - name: Upload Ingestion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-artifacts
          path: |
            artifact/data/*.csv
            artifact/data/*_seed.sql
            artifact/data/seed.sql

# ─────────────────────────────────────────────────────────
# JOB 2 · ML Pipeline
# Jalankan DVC ml_pipeline (LSTM & GRU per ticker via matrix)
# Hasilkan: *.keras, *_scaler.json, *_metrics.json, *_model_seed.sql
# ─────────────────────────────────────────────────────────
  pipeline:
    name: "② ML Pipeline — DVC LSTM & GRU Training"
    needs: ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Download Ingestion Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ingestion-artifacts
          path: artifact/data/

      - name: Run DVC ML Pipeline (LSTM & GRU)
        run: poetry run dvc repro ml_pipeline

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Publish Notebook Reports to GitHub Summary
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          notebooks=(artifact/notebook/*.ipynb)

          mkdir -p artifact/notebook

          for nb in "${notebooks[@]}"; do
            if [ -f "$nb" ]; then
              stage=$(basename "$nb" .ipynb)
              echo "Processing $nb ($stage)..."
              poetry run jupyter nbconvert --to markdown --no-input "$nb" --output-dir artifact/notebook || true

              if [ -d "artifact/notebook/${stage}_files" ]; then
                for img in artifact/notebook/${stage}_files/*.png; do
                  if [ -f "$img" ]; then
                    img_url=$(cml publish "$img" || echo "")
                    filename=$(basename "$img")
                    if [ -n "$img_url" ]; then
                      sed -i "s|${stage}_files/${filename}|${img_url}|g" "artifact/notebook/${stage}.md" || true
                    fi
                  fi
                done
              fi

              if [ -f "artifact/notebook/${stage}.md" ]; then
                cat "artifact/notebook/${stage}.md" >> $GITHUB_STEP_SUMMARY
                echo -e "\n\n---\n\n" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: Push ML Artifacts & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update ml pipeline artifacts [skip ci]"

      - name: Upload Notebook Reports
        uses: actions/upload-artifact@v4
        with:
          name: notebook-reports
          path: artifact/notebook/**

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.json
            artifact/model/*_metrics.json

      - name: Upload SQL Seed Artifacts (dari pipeline)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-sql-artifacts
          path: |
            artifact/data/models_seed.sql

# ─────────────────────────────────────────────────────────
# JOB 3 · Seed D1
# Jalankan migrasi D1, lalu seed stock_prices & stock_models
# dari SQL files yang dihasilkan pipeline
# ─────────────────────────────────────────────────────────
  seed_d1:
    name: "③ Seed D1 — Migrate & Seed Cloudflare D1"
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd web/backend
          npm ci

      - name: Download Ingestion Artifacts (stock_prices SQL seed)
        uses: actions/download-artifact@v4
        with:
          name: ingestion-artifacts
          path: artifact/data/

      - name: Download Pipeline SQL Artifacts (stock_models SQL seed)
        uses: actions/download-artifact@v4
        with:
          name: pipeline-sql-artifacts
          path: artifact/data/

      - name: Run D1 Migrations (Remote)
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/backend
          command: d1 migrations apply stock-forecast-db --remote

      - name: Seed stock_prices into D1
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/backend
          command: d1 execute stock-forecast-db --remote --file=../../artifact/data/seed.sql

      - name: Seed stock_models into D1
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/backend
          command: d1 execute stock-forecast-db --remote --file=../../artifact/data/models_seed.sql

# ─────────────────────────────────────────────────────────
# JOB 4 · Deploy Backend
# Deploy Cloudflare Workers API setelah D1 siap
# ─────────────────────────────────────────────────────────
  deploy_backend:
    name: "④ Deploy Backend — Cloudflare Workers"
    needs: seed_d1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd web/backend
          npm ci

      - name: Build Backend with Nitro
        run: |
          cd web/backend
          npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/backend
          command: deploy

# ─────────────────────────────────────────────────────────
# JOB 5 · Deploy Frontend
# Build & deploy Cloudflare Pages (berjalan paralel dengan deploy_backend)
# ─────────────────────────────────────────────────────────
  deploy_frontend:
    name: "⑤ Deploy Frontend — Cloudflare Pages"
    needs: seed_d1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web/frontend
          command: pages deploy .output/public --project-name stock-forecasting-web
