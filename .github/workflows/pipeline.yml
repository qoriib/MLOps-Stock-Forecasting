name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  pipeline:
    name: "ML Pipeline"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC ML Pipeline
        run: poetry run dvc repro

      - name: Push Data & Git State
        uses: ./.github/actions/push-pipeline

      - name: Upload Notebook Reports
        uses: actions/upload-artifact@v7
        with:
          name: artifact-notebook
          path: artifact/notebook/**

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-model
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.pkl
            artifact/model/*_hyperparameter.csv

  deploy_backend:
    name: "Deploy Backend"
    needs: pipeline
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pipeline Environment (DVC Pull)
        uses: ./.github/actions/setup-pipeline

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          clean: true
          package: web/backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

  deploy_frontend:
    name: "Deploy Frontend"
    needs: pipeline
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          cd web/frontend
          npx -y @azure/static-web-apps-cli deploy .output/public \
            --env production \
            --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" \
            --no-use-keychain
