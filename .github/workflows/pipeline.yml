name: End-to-End Stock Forecasting Data & ML Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_ml:
        description: "Skip ML Pipeline"
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  pipeline:
    name: "ML Pipeline"
    if: ${{ github.event_name == 'schedule' || !inputs.skip_ml }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC ML Pipeline
        run: poetry run dvc repro

      - name: Push Data & Git State
        uses: ./.github/actions/push-pipeline

      - name: Publish ML Pipeline Summary
        run: poetry run python -m src.report

      - name: Upload Notebook Reports
        uses: actions/upload-artifact@v4
        with:
          name: artifact-notebook
          path: artifact/notebook/**

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-model
          path: |
            artifact/model/*_LSTM.keras
            artifact/model/*_GRU.keras
            artifact/model/*_scaler.pkl
            artifact/model/*_hyperparameter.csv

  deploy_backend:
    name: "Deploy Backend"
    needs: pipeline
    if: ${{ always() && !cancelled() && (needs.pipeline.result == 'success' || needs.pipeline.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: mlops-stock-forecasting-rg
      AZURE_ACR_NAME: acrstockforecast
      CONTAINER_APP_NAME: ca-stock-backend
      CONTAINER_APP_ENVIRONMENT: ca-stock-backend-env
    outputs:
      backend_url: ${{ steps.get-backend-url.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        id: acr-creds
        run: |
          echo "username=$(az acr credential show -n ${{ env.AZURE_ACR_NAME }} --query username -o tsv)" >> $GITHUB_OUTPUT
          echo "password=$(az acr credential show -n ${{ env.AZURE_ACR_NAME }} --query 'passwords[0].value' -o tsv)" >> $GITHUB_OUTPUT

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          targetPort: 8000
          ingress: external
          location: eastasia
          appSourcePath: ${{ github.workspace }}/web/backend
          acrName: ${{ env.AZURE_ACR_NAME }}
          acrUsername: ${{ steps.acr-creds.outputs.username }}
          acrPassword: ${{ steps.acr-creds.outputs.password }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Get Container App URL
        id: get-backend-url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=https://$FQDN" >> $GITHUB_OUTPUT

      - name: Publish Backend Deployment Summary
        run: |
          echo "## 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container App** | \`${{ env.CONTAINER_APP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resource Group** | \`${{ env.AZURE_RESOURCE_GROUP }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend URL** | [${{ steps.get-backend-url.outputs.backend_url }}](${{ steps.get-backend-url.outputs.backend_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Docs (Swagger)** | [${{ steps.get-backend-url.outputs.backend_url }}/docs](${{ steps.get-backend-url.outputs.backend_url }}/docs) |" >> $GITHUB_STEP_SUMMARY

  deploy_frontend:
    name: "Deploy Frontend"
    needs: deploy_backend
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ needs.deploy_backend.outputs.backend_url }}
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          cd web/frontend
          npx -y @azure/static-web-apps-cli deploy dist \
            --env production \
            --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" \
            --no-use-keychain

      - name: Publish Frontend Deployment Summary
        run: |
          echo "## 🌐 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | Azure Static Web Apps |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Connected Backend API** | \`${{ needs.deploy_backend.outputs.backend_url }}\` |" >> $GITHUB_STEP_SUMMARY
