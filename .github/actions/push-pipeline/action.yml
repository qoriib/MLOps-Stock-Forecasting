name: 'Push Pipeline'
description: 'Pushes updated data cache to DVC remote and commits/pushes all working tree changes to GitHub.'

inputs:
  commit-message:
    description: 'Custom commit message for Git push'
    required: false
    default: 'auto: update dvc tracking files and pipeline artifacts [skip ci]'

runs:
  using: 'composite'
  steps:
    - name: DVC Commit
      shell: bash
      run: poetry run dvc commit -f

    - name: DVC Push
      shell: bash
      run: poetry run dvc push

    - name: Git Commit and Push
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase || true
          git push
        fi
