name: 'Setup Pipeline Environment'
description: 'Sets up Python, Poetry, installs dependencies, and pulls DVC data.'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Configure Git Bot
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install Dependencies
      shell: bash
      run: poetry install --no-interaction

    - name: Configure DVC Remote for DagsHub
      shell: bash
      run: |
        if [ -n "$DAGSHUB_USER_TOKEN" ]; then
          poetry run dvc remote modify origin --local access_key_id "$DAGSHUB_USER_TOKEN"
          poetry run dvc remote modify origin --local secret_access_key "$DAGSHUB_USER_TOKEN"
        fi

    - name: DVC Pull
      shell: bash
      run: |
        poetry run dvc pull --run-cache || echo "DVC pull completed or skipped"
