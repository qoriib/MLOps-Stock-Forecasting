version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: stock-forecast-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      # Mount direktori artefak lokal agar pembaruan model DVC langsung terbaca
      - ./artifact/model:/app/artifact/model:ro
      - ./artifact/data:/app/artifact/data:ro
    restart: unless-stopped
